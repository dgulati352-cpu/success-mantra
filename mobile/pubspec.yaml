name: success_mantra
description: "Official Success Mantra Mobile App - CA Manish Kalra Commerce Academy"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Network
  provider: ^6.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI & Media
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  intl: ^0.19.0
  
  # Video & PDF Viewer
  video_player: ^2.8.2
  chewie: ^1.7.4
  flutter_pdfview: ^1.3.2
  
  # Payments
  razorpay_flutter: ^1.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
